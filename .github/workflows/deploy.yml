name: Deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'knowledge/**'
      - '*.md'

env:
  FUNCTION_APP_NAME: shagilnizami786-api
  RESOURCE_GROUP: rg-shagilnizami786-1129

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure Function App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Build web
        run: npm run build -w @resume-builder/web
        env:
          CI: true

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build Azure Functions package
        run: |
          npm run build:function -w @resume-builder/api
          rm -rf .function-package function-package.zip
          mkdir -p .function-package/dist/migrations/meta
          cp apps/api/dist/function.js .function-package/dist/function.js
          cp packages/db/src/migrations/*.sql .function-package/dist/migrations/
          cp packages/db/src/migrations/meta/* .function-package/dist/migrations/meta/
          cp deploy/function/host.json deploy/function/package.json .function-package/
          cp deploy/function/index.js .function-package/index.js
          (cd .function-package && zip -qr ../function-package.zip .)

      - name: Deploy to Azure Function App
        run: |
          az functionapp deployment source config-zip \
            --name ${{ env.FUNCTION_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --src function-package.zip \
            --build-remote true
          az functionapp config appsettings set \
            --name ${{ env.FUNCTION_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --settings \
              FUNCTIONS_WORKER_RUNTIME=node \
              FUNCTIONS_EXTENSION_VERSION=~4 \
              WEBSITE_NODE_DEFAULT_VERSION=~22 \
              KEY_VAULT_URL=${{ vars.KEY_VAULT_URL }} \
              DATABASE_HOST=${{ vars.DATABASE_HOST }} \
              DATABASE_PORT=${{ vars.DATABASE_PORT }} \
              DATABASE_NAME=${{ vars.DATABASE_NAME }} \
              DATABASE_SSL=true \
              AZURE_OPENAI_ENDPOINT=${{ vars.AZURE_OPENAI_ENDPOINT }} \
              AZURE_OPENAI_DEPLOYMENT=${{ vars.AZURE_OPENAI_DEPLOYMENT }} \
              BLOB_ACCOUNT_NAME=${{ vars.BLOB_ACCOUNT_NAME }} \
              BLOB_CONTAINER=${{ vars.BLOB_CONTAINER }} \
              DOC_INTELLIGENCE_ENDPOINT=${{ vars.DOC_INTELLIGENCE_ENDPOINT }} \
              SEARCH_ENDPOINT=${{ vars.SEARCH_ENDPOINT }} \
              SEARCH_INDEX=${{ vars.SEARCH_INDEX }}
