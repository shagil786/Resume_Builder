name: Deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'knowledge/**'
      - '*.md'

env:
  AZURE_CONTAINER_REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
  API_IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/resume-builder/api:${{ github.sha }}
  CONTAINER_APP_NAME: resume-builder-api
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Build web
        run: npm run build -w @resume-builder/web
        env:
          CI: true

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push API image
        run: |
          docker build -f deploy/Dockerfile.api -t ${{ env.API_IMAGE }} .
          docker push ${{ env.API_IMAGE }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.API_IMAGE }} \
            --set-env-vars \
              KEY_VAULT_URL=${{ vars.KEY_VAULT_URL }} \
              DATABASE_HOST=${{ vars.DATABASE_HOST }} \
              DATABASE_PORT=${{ vars.DATABASE_PORT }} \
              DATABASE_NAME=${{ vars.DATABASE_NAME }} \
              DATABASE_SSL=true \
              AZURE_OPENAI_ENDPOINT=${{ vars.AZURE_OPENAI_ENDPOINT }} \
              AZURE_OPENAI_DEPLOYMENT=${{ vars.AZURE_OPENAI_DEPLOYMENT }} \
              BLOB_ACCOUNT_NAME=${{ vars.BLOB_ACCOUNT_NAME }} \
              BLOB_CONTAINER=${{ vars.BLOB_CONTAINER }} \
              DOC_INTELLIGENCE_ENDPOINT=${{ vars.DOC_INTELLIGENCE_ENDPOINT }} \
              SEARCH_ENDPOINT=${{ vars.SEARCH_ENDPOINT }} \
              SEARCH_INDEX=${{ vars.SEARCH_INDEX }}
